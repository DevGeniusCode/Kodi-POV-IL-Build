name: Upstream repository health

# repository.povil.upstream aggregates several third-party indexes. Kodi fails the WHOLE repository update when any one of them is
# unreachable or malformed (so our own add-ons would stop updating too). This workflow finds out first.
# It also fails when an upstream index carries an add-on id that is one of ours (it would replace our fork).
#
# Scheduled workflows run on the default branch only, and GitHub pauses them after 60 days without repository activity.

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "repository.povil.upstream/**"
      - ".github/scripts/check_upstreams.py"
      - ".github/workflows/upstream-health.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check every upstream index
        run: python .github/scripts/check_upstreams.py
