name: Subtitle add-on contract test

# Stdlib-only smoke test of service.subtitles.kodipovilai: provider contract, frozen names, pinned strings, no private
# cross-module names, single route, settings / strings consistency, every module imports under stubs, and the chooser's
# one-owner-thread unit check (.github/scripts/subs_contract/unit_chooser_threads.py). No golden fixtures any more.

on:
  push:
    paths:
      - "service.subtitles.kodipovilai/**"
      - ".github/scripts/check_subs_contract.py"
      - ".github/scripts/subs_contract/**"
      - ".github/workflows/subs-contract.yml"
  pull_request:
    paths:
      - "service.subtitles.kodipovilai/**"
      - ".github/scripts/check_subs_contract.py"
      - ".github/scripts/subs_contract/**"
      - ".github/workflows/subs-contract.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run the contract test
        run: python .github/scripts/check_subs_contract.py
