name: Build Kodi repository and deploy to GitHub Pages

# Replaces the old "build zips -> rolling release -> manifest.json" pipeline.
#
# One run = the whole repository site:
#   addons.xml + addons.xml.md5 + zips/<id>/<id>-<ver>.zip + config/ (userdata pack) + index.html
# A Pages artifact replaces the entire site on every deploy, so every add-on is rebuilt every time
# (zips are deterministic: unchanged add-ons produce identical bytes). There is no git history of zips
# and no release asset to prune.
#
# ONE-TIME SETUP (repo Settings -> Pages): Build and deployment -> Source = "GitHub Actions".
# Also check Settings -> Environments -> github-pages: "main" must be an allowed deployment branch.

on:
  push:
    branches: [main]
    paths:
      - "plugin.*/**"
      - "repository.*/**"
      - "script.*/**"
      - "service.*/**"
      - "skin.*/**"
      - "resource.*/**"
      - "userdata/**"
      - ".github/scripts/**"
      - ".github/workflows/deploy-repo.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Never two deploys at once; let a running deploy finish rather than cancel it half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the baked favourites against favourites_config.json
        run: python .github/scripts/check_favourites.py

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Generate the repository site
        # --base-url is the public Pages address, e.g. https://<owner>.github.io/<repo>
        run: python .github/scripts/gen_repo.py --out site --base-url "${{ steps.pages.outputs.base_url }}"

      - name: Upload the site as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  warm:
    # A deploy replaces the whole site, so the Pages CDN holds none of the new files and the first reader pays for the origin
    # fetch (measured: 61 s for the 4.6 MB Wizard zip, 2 s once cached). Kodi's low-speed timeout turns that into
    # "Timeout was reached(28)". One GET of every stable zip and of the index right after the deploy moves that cost here.
    # Best effort: the CDN cache is per edge location and the runner reaches one of them, so this lowers the odds, it does not
    # guarantee them. A failure here never undoes the deploy (continue-on-error).
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch the index and every stable zip once
        env:
          SITE: ${{ needs.deploy.outputs.page_url }}
        run: |
          base="${SITE%/}"
          # gen_repo.STABLE_ALIASES is the single list of the <id>-latest.zip files the site publishes
          ids="$(python -c "import sys; sys.path.insert(0, '.github/scripts'); import gen_repo; print(*gen_repo.STABLE_ALIASES)")"
          urls="$base/ $base/addons.xml $base/addons.xml.sha256 $base/addons.xml.md5"
          for id in $ids; do
            urls="$urls $base/$id-latest.zip $base/$id-latest.zip.sha256"
          done
          failed=0
          for url in $urls; do
            if ! curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --max-time 300 -o /dev/null \
                 -w "%{http_code} %{size_download} B in %{time_total}s  $url\n" "$url"; then
              echo "::warning::could not fetch $url"
              failed=1
            fi
          done
          exit $failed
